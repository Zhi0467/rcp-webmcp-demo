[project]
name = "rcp"
dynamic = ["version"]
description = "RCP: a human comprehension surface for agent-driven research projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "python-multipart>=0.0.20",
  "pydantic>=2.11.0",
  "tomlkit>=0.13.3",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
rcp = "rcp.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pre-commit>=4.0",
  "pyinstaller>=6.21.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcp"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "rcp/web_dist"
"src/rcp/skills/graph-audit" = "rcp/skills/graph-audit"
"src/rcp/skills/evidence-triage" = "rcp/skills/evidence-triage"
"src/rcp/skills/experiment-causality" = "rcp/skills/experiment-causality"
"src/rcp/skills/episode-report" = "rcp/skills/episode-report"
"src/rcp/skills/workflows" = "rcp/skills/workflows"

[tool.hatch.version]
path = "src/rcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "web",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
